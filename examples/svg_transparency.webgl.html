<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG review: translucent points, borders and triangle surfaces</title>
  <script defer src="https://cdn.jsdelivr.net/npm/x_ite@12.1.9/dist/x_ite.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      try {
        const scene = document.getElementById('molscript-scene-data');
        const canvas = document.getElementById('molscript-scene');
        const xml = scene.value.trimStart();
        console.log('MolScriptSVG WebGL: parsing XML scene', xml.length);
        const doc = new DOMParser().parseFromString(xml, 'application/xml');
        const parseError = doc.querySelector('parsererror');
        if (parseError) {
          throw new Error(parseError.textContent || 'X3D XML parse error');
        }
        canvas.appendChild(document.importNode(doc.documentElement, true));
        console.log('MolScriptSVG WebGL: scene attached');
      } catch (error) {
        console.error('MolScriptSVG WebGL load failed:', error);
      }
    });
  </script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
    x3d-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #molscript-scene-data {
      display: none;
    }
  </style>
</head>
<body>
  <textarea id="molscript-scene-data">&lt;?xml version="1.0" encoding="UTF-8"?>
